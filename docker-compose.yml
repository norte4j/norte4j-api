services:
  mysql:
    image: mysql:8.4
    container_name: norte4j-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: norte4j
      MYSQL_USER: norte4j
      MYSQL_PASSWORD: norte4j_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - norte4j_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  norte4j_mysql_data:
